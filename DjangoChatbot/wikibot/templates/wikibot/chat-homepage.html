<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WikiBot</title>
    {% csrf_token %}
    <script>
        var csrf = "{{ csrf_token }}"
    </script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    {% load static %}
    <link rel="stylesheet" href="{% static 'wikibot/css/chat-styles.css' %}">
    <script src="{% static 'wikibot/js/chat-scripts.js' %}"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="header-info">
                <div class="avatar">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/6/61/Wikipedia-logo-transparent.png" alt="Source: Wikipedia">
                </div>
                <div>
                    <div class="agent-name">Wikibot</div>
                    <div class="agent-status">
                        <span class="status-dot"></span>
                        Online | Wikipedia Expert
                    </div>
                </div>
            </div>
            <div class="header-actions">
                <button id="graph-button"><i class="fas fa-bar-chart"></i></button>
            </div>
        </div>
        <div class="chat-body" id="chat-body">
            <div class="message agent">
                <div>Hi there! I'm Wikibot. What would you like to talk about today?</div>
                <div class="time" id="init_msg">12:00 AM</div>
            </div>
        </div>
        <div class="quick-replies">
            <!--<button class="quick-reply selected">All (Default)</button>-->
            <button class="quick-reply">Health</button>
            <button class="quick-reply">Environment</button>
            <button class="quick-reply">Technology</button>
            <button class="quick-reply">Economy</button>
            <button class="quick-reply">Entertainment</button>
            <button class="quick-reply">Sports</button>
            <button class="quick-reply">Politics</button>
            <button class="quick-reply">Education</button>
            <button class="quick-reply">Travel</button>
            <button class="quick-reply">Food</button>
        </div>
        <div class="chat-footer">
            <div class="input-container">
                <input type="text" class="input-field" id="message-input" placeholder="Type a message...">
            </div>
            <button class="send-button" id="send-button">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>
    <div class="graph-container" id="graph" style="display: none;">
        <div class="graph-body" id="graph-list">
            <img src="{% static 'images/myhouse.png' %}" alt="My house :)">
        </div>
    </div>
</body>
</html>
